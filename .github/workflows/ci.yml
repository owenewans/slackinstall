name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig build test
      - run: zig fmt --check src/ build.zig
      - run: sh -n install.sh tests/qemu/run.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
      - uses: actions/upload-artifact@v4
        with:
          name: slackinstall-${{ matrix.target }}
          path: zig-out/bin/slackinstall
