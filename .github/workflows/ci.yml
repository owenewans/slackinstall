name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig fmt --check src/ build.zig

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-linux-musl, x86-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSmall
      - uses: actions/upload-artifact@v4
        with:
          name: slackinstall-${{ matrix.target }}
          path: zig-out/bin/slackinstall
