name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - run: zig build test
      - run: |
          for target in x86_64-linux-musl x86-linux-musl; do
            zig build -Dtarget="$target" -Doptimize=ReleaseSmall
            mv zig-out/bin/owenslackinstall "owenslackinstall-$target"
            sha256sum "owenslackinstall-$target" > "owenslackinstall-$target.sha256"
          done
      - run: >-
          gh release create "$GITHUB_REF_NAME"
          owenslackinstall-x86_64-linux-musl
          owenslackinstall-x86_64-linux-musl.sha256
          owenslackinstall-x86-linux-musl
          owenslackinstall-x86-linux-musl.sha256
          --title "$GITHUB_REF_NAME"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
